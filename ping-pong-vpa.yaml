apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: ping-pong-vpa
spec:
  targetRef:
    apiVersion: "apps/v1"
    kind: Deployment
    name: ping-pong-deployment
  updatePolicy:
    updateMode: "Recreate"
  resourcePolicy:
    containerPolicies:
    - containerName: "ping-pong-deployment"
      minAllowed:
        cpu: 500m
        memory: 128Mi
      maxAllowed:
        cpu: 2
        memory: 2Gi
      controlledResources:
      - cpu
      - memory
      controlledValues: RequestsAndLimits